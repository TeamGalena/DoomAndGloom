modLoader="javafml"
loaderVersion="[1,)"
license="MIT"
issueTrackerURL="https://github.com/${repository}/issues/"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
updateJSONURL="https://api.modrinth.com/updates/doom-gloom/forge_updates.json?neoforge=only"
displayURL="https://www.curseforge.com/minecraft/mc-mods/doom-gloom"
logoFile="${mod_id}.png"
logoBlur=false
itemIcon="${mod_id}:bush_hammer"
configBackground="${mod_id}:textures/block/bone_pile_side.png"
credits="Thanks to our wonderful Patreon members and those who help participate in discussions on our Discord server!"
authors="${mod_author}"
description='''
An addon-mod for Oreganized adding Halloween-themed content
'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    versionRange = "[21,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    versionRange = "[1.21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="moonlight"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="oreganized"
    type = "optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"