modLoader="javafml"
loaderVersion="[43,)"
license="MIT"
issueTrackerURL="https://github.com/${repository}/issues/"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
updateJSONURL="https://api.modrinth.com/updates/doom-and-gloom/forge_updates.json"
displayURL="https://www.curseforge.com/minecraft/mc-mods/doom-and-gloom"
logoFile="${mod_id}.png"
logoBlur=false
itemIcon="${mod_id}:bush_hammer"
configBackground="${mod_id}:textures/block/bone_pile_side.png"
credits="Thanks to our wonderful Patreon members and those who help participate in discussions on our Discord server!"
authors="${mod_author}"
description='''
An addon-mod for Oreganized adding Halloween-themed content
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[43,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20,1.21)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="blueprint"
    mandatory=true
    versionRange="[7.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="oreganized"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"